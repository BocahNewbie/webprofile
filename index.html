<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUMAH BOCAH</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <header class="hero">
      <h1 id="profile-title">Loading...</h1>
      <h3 id="profile-subtitle" class="hero-subtitle">Loading...</h3>
      <p id="profile-desc">Loading...</p>
    </header>

    <main>
      <h2 class="section-title">Project Pilihan</h2>
      <div class="projects-grid" id="projects-grid"></div>
    </main>

    <footer>
      <div class="social-links">
        <!-- Link Instagram -->
        <a href="https://instagram.com/kaka_ramdhani" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>

        <!-- Link TikTok -->
        <a href="https://tiktok.com/@hello_iambaba" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="TikTok">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>
          </svg>
        </a>
      </div>
      <p>&copy; 2026 Web Rumah Bocah. All rights reserved.</p>
    </footer>
  </div>

  <!-- Modal Pop-up Card Project -->
  <div id="project-modal" class="modal-overlay">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">&times;</button>
      <span id="modal-tag" class="project-tag">Tag</span>
      <h2 id="modal-title" class="project-title">Title</h2>
      <p id="modal-desc" class="project-desc-full"></p>
      
      <div class="modal-section-title">Teknologi:</div>
      <div id="modal-tech" class="project-tech"></div>

      <div class="modal-section-title">Akses Link Project:</div>
      <div id="modal-links" class="modal-links-container"></div>
    </div>
  </div>

  <!-- Footer Music Player Bar -->
  <div id="music-player-bar" class="music-bar">
      <div class="player-left">
          <button id="player-toggle-btn" class="player-btn" aria-label="Play/Pause">
              <!-- Icon Play -->
              <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <!-- Icon Pause (hidden by default) -->
              <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>
          <div class="track-info">
              <span id="track-title">Pilih atau Masukkan Lagu</span>
              <span id="track-artist">Rumah Bocah Music</span>
          </div>
      </div>

      <div class="player-center">
          <div class="player-controls-sub">
              <button id="prev-btn" class="sub-btn" title="Lagu Sebelumnya">⏮</button>
              <span id="current-time">0:00</span>
              <input type="range" id="progress-bar" value="0" max="100" step="0.1">
              <span id="duration">0:00</span>
              <button id="next-btn" class="sub-btn" title="Lagu Berikutnya">⏭</button>
          </div>
      </div>

      <div class="player-right">
          <button id="playlist-btn" class="action-pill-btn">🎵 Playlist (10)</button>
          <button id="youtube-custom-btn" class="action-pill-btn">🔗 Putar YouTube</button>
      </div>
  </div>

  <!-- Modal Playlist & Input YouTube -->
  <div id="music-modal" class="modal-overlay">
      <div class="modal-content music-modal-content">
          <button id="music-modal-close" class="modal-close">&times;</button>
          <h2 class="project-title" id="music-modal-title">Pilih Sumber Musik</h2>
          
          <!-- Tab Navigasi Modal -->
          <div class="music-tabs">
              <button class="tab-btn active" data-target="playlist-section">Daftar 10 Lagu</button>
              <button class="tab-btn" data-target="youtube-section">Custom Link YouTube</button>
          </div>

          <!-- Section 1: 10 Playlist -->
          <div id="playlist-section" class="music-tab-content">
              <div id="playlist-list" class="playlist-container">
                  <!-- Daftar lagu dimuat otomatis dari config.js -->
              </div>
          </div>

          <!-- Section 2: Input YouTube -->
          <div id="youtube-section" class="music-tab-content" style="display:none;">
              <p class="project-desc-full">Masukkan link video YouTube yang ingin kamu putar sebagai audio di web:</p>
              <div class="youtube-input-group">
                  <input type="text" id="youtube-url-input" placeholder="Contoh: https://www.youtube.com/watch?v=xxxxxx" class="custom-input">
                  <button id="play-youtube-btn" class="primary-btn">Putar dari YouTube</button>
              </div>
          </div>
      </div>
  </div>

  <!-- Elemen Audio & YouTube iFrame Tersembunyi -->
  <audio id="audio-element" preload="metadata"></audio>
  <div id="youtube-player-container" style="display:none;"></div>

  <!-- URUTAN SCRIPT: config.js HARUS DI ATAS script.js -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
