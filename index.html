<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rumah Bocah</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <header class="hero">
      <h1 id="profile-title">Loading...</h1>
      <p id="profile-desc">Loading...</p>
    </header>

    <main>
      <h2 class="section-title">My Project</h2>
      <div class="projects-grid" id="projects-grid"></div>
    </main>

    <footer>
      <p>&copy; 2026 Web Profile. All rights reserved. Bocah Newbie.</p>
    </footer>
  </div>

  <!-- Modal Pop-up Card Project -->
  <div id="project-modal" class="modal-overlay">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">&times;</button>
      <span id="modal-tag" class="project-tag">Tag</span>
      <h2 id="modal-title" class="project-title">Title</h2>
      <p id="modal-desc" class="project-desc-full"></p>

      <div class="modal-section-title">Akses Link Project:</div>
      <div id="modal-links" class="modal-links-container"></div>
    </div>
  </div>

  <!-- UBAH URUTAN DI SINI: config.js HARUS DI ATAS script.js -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
